name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails the build when a price in public/index.html differs from
      # functions/_lib/products.js (the server price is what customers pay).
      - name: Check that page prices match server prices
        run: node scripts/check-prices.mjs

      # Fails the build when any font-size below 12px appears in public/index.html.
      - name: Check the 12px font floor
        run: node scripts/check-fonts.mjs

      # Creates the free Cloudflare Pages project on the first run. Later runs
      # report "already exists", which is expected, so this step never fails the build.
      - name: Create the Pages project if it does not exist
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create flour-to-the-people --production-branch=main

      # Turns payments on when the GitHub secrets STRIPE_SECRET_KEY and
      # STRIPE_PUBLISHABLE_KEY exist: orders database, Stripe webhook, Pages secrets.
      # Skips itself when they do not. See scripts/ci-payments.sh.
      - name: Set up payments and the orders database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
          SITE_URL: https://flour-to-the-people-5vp.pages.dev
        run: bash scripts/ci-payments.sh

      # Deploys public/ as the site and functions/ as the Stripe API.
      # wrangler.toml supplies the D1 binding named DB.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=flour-to-the-people --branch=main

      # Sends a sample order alert email when this run was started by hand from the
      # Actions tab, or the commit message contains "[send test order alert]".
      # The result is recorded on the commit as the status "Order alert test".
      - name: Send a test order alert email
        if: success() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[send test order alert]'))
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
        run: |
          sleep 10
          RESP="$(curl -sS -m 60 -X POST "$URL/api/order-alert-test" -H "Authorization: Bearer $PROTON_SMTP_TOKEN" || echo '{"sent":false,"error":"request failed"}')"
          echo "$RESP"
          DESC="$(printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let j;try{j=JSON.parse(s)}catch{j={error:s}};process.stdout.write(j.sent?"Test email sent":("Failed: "+(j.error||s)).slice(0,135))})')"
          STATE=failure; [ "$DESC" = "Test email sent" ] && STATE=success
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" -f context="Order alert test" -f description="$DESC"
          [ "$STATE" = success ]

      # Records the deployed web address on the commit, so anyone (or any agent)
      # can find it on GitHub without reading the logs.
      - name: Record the site address on the commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Deployed to: $URL"
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success -f context="Cloudflare Pages" \
            -f description="Site deployed" -f target_url="$URL"
