# Cloudflare Pages configuration (Wrangler 3.45.0 or newer).
# When this file contains pages_build_output_dir, Cloudflare uses the bindings
# below for production AND preview deployments.
# Secrets (STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET,
# STRIPE_TAX_ENABLED) are never stored here; scripts/03-stripe.sh uploads them
# with `wrangler pages secret bulk`.

name = "flour-to-the-people"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./public"

# Orders database: switched off until payments are set up (scripts/02-cloudflare.sh).
# To turn on, remove the leading '# ' from the lines below and run that script.
# [[d1_databases]]
# binding = "DB"
# database_name = "flour-to-the-people-orders"
# # scripts/02-cloudflare.sh replaces this placeholder with the real database ID.
# database_id = "REPLACE_WITH_DATABASE_ID"
